<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ninja Series | HANHONG PLASTIC TOYS FACTORY</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Helvetica Neue", Arial, "PingFang SC", sans-serif;
    background: #0f1c2e;
    color: #e2e8f0;
    min-height: 100vh;
  }
  header {
    background: linear-gradient(135deg, #162a42 0%, #0f1c2e 100%);
    border-bottom: 2px solid #e07b39;
    padding: 24px 20px 20px;
    text-align: center;
  }
  header h1 { font-size: 24px; color: #fff; letter-spacing: 2px; }
  header p { font-size: 13px; color: #8a9bb5; margin-top: 6px; }
  .back {
    display: inline-block;
    margin: 16px auto 0;
    font-size: 13px;
    color: #c9a84c;
    text-decoration: none;
  }
  .back:hover { text-decoration: underline; }
  .gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    padding: 20px 20px 40px;
    max-width: 720px;
    margin: 0 auto;
  }
  @media (min-width: 641px) {
    .gallery { grid-template-columns: repeat(3, 1fr); max-width: 1080px; }
  }
  .gallery a {
    display: block;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #1e3a5f;
    background: #162a42;
    cursor: zoom-in;
  }
  .gallery img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
    transition: transform 0.2s;
  }
  .gallery a:hover img { transform: scale(1.04); }
  .gallery .cap {
    display: block;
    padding: 8px 10px;
    font-size: 11px;
    color: #c9a84c;
    background: #122238;
    letter-spacing: 0.5px;
    line-height: 1.5;
  }
  /* Lightbox */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(5, 10, 18, 0.92);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-width: 92vw;
    max-height: 88vh;
    border-radius: 8px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.6);
  }
  .lightbox .close {
    position: absolute;
    top: 16px;
    right: 24px;
    font-size: 34px;
    color: #fff;
    cursor: pointer;
    line-height: 1;
  }
  .cta {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    padding: 8px 20px 36px;
  }
  .btn {
    display: inline-block;
    font-weight: 700;
    font-size: 15px;
    padding: 14px 28px;
    border-radius: 8px;
    text-decoration: none;
    letter-spacing: 0.5px;
    text-align: center;
    min-width: 210px;
    transition: background 0.2s;
  }
  .btn-wa { background: #25d366; color: #0a2e17; }
  .btn-wa:hover, .btn-wa:active { background: #1fbe5a; }
  .btn-mail { background: transparent; color: #c9a84c; border: 1.5px solid #c9a84c; }
  .btn-mail:hover, .btn-mail:active { background: rgba(201, 168, 76, 0.12); }
  @media (max-width: 520px) {
    .btn { width: 100%; max-width: 320px; min-width: 0; }
  }
  footer {
    text-align: center;
    padding: 20px;
    font-size: 12px;
    color: #4a5568;
    border-top: 1px solid #1e3a5f;
  }
</style>
</head>
<body>

<header>
  <h1>NINJA SERIES</h1>
  <p>Ninja weapons & role-play sets · Classic ninja styling, rich accessories</p>
  <a class="back" href="index.html">← Back to Home</a>
</header>

<div class="gallery">
  <a href="pics/ninja/ninja-1.jpg"><img src="pics/ninja/ninja-1.jpg" alt="Ninja product 1"></a>
  <a href="pics/ninja/ninja-2.jpg"><img src="pics/ninja/ninja-2.jpg" alt="Ninja product 2"></a>
  <a href="pics/ninja/ninja-3.jpg"><img src="pics/ninja/ninja-3.jpg" alt="Ninja product 3"></a>
  <a href="pics/ninja/ninja-4.jpg"><img src="pics/ninja/ninja-4.jpg" alt="Ninja product 4"></a>
</div>

<div class="cta">
  <a class="btn btn-wa" href="https://wa.me/8613923943220" target="_blank" rel="noopener">Chat on WhatsApp</a>
  <a class="btn btn-mail" href="mailto:weihong-555@163.com">Email Us About This Series</a>
</div>

<footer>
  © 2026 HANHONG PLASTIC TOYS FACTORY · Shantou, Guangdong, China
</footer>

<div class="lightbox" id="lightbox">
  <span class="close" onclick="document.getElementById('lightbox').classList.remove('open')">×</span>
  <img id="lightbox-img" src="" alt="Enlarged product photo">
</div>

<script>
  document.querySelectorAll('.gallery a').forEach(function (link) {
    link.addEventListener('click', function (e) {
      e.preventDefault();
      var lb = document.getElementById('lightbox');
      document.getElementById('lightbox-img').src = link.getAttribute('href');
      lb.classList.add('open');
    });
  });
  document.getElementById('lightbox').addEventListener('click', function (e) {
    if (e.target === this) this.classList.remove('open');
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('open');
  });
</script>

</body>
</html>
